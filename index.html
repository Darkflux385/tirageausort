<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gagne un Snap+ pendant 1 semaine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>🎁 Gagne un Snap+ pendant 1 semaine !</h1>
  <p class="sub">Entre ton pseudo et ton Snap pour participer. 1 seule participation par personne !</p>
  <div class="card">
    <input id="pseudo" placeholder="Ton pseudo" maxlength="30">
    <input id="snap" placeholder="Ton Snap (obligatoire)" maxlength="30">
    <button id="join">Participer 🎉</button>
    <p id="msg"></p>
  </div>
  <p class="count"><span id="count">0</span> participation(s)</p>
  <div id="list"></div>
  <div class="card admin">
    <button id="adminBtn" class="ghost">🔒 Admin</button>
    <div id="adminPanel" hidden>
      <div id="loginZone">
        <input id="code" type="password" placeholder="Code admin">
        <button id="login">Valider</button>
        <p id="adminMsg"></p>
      </div>
      <div id="adminZone" hidden>
        <button id="draw">Lancer le tirage 🎲</button>
        <button id="reset" class="ghost">Tout supprimer</button>
        <button id="clearHist" class="ghost">Vider l'historique</button>
      </div>
    </div>
  </div>
  <div id="winner" class="winner" hidden>
    <div id="winnerText"></div>
    <button id="copy" class="ghost">📋 Copier le Snap du gagnant</button>
  </div>
  <div class="card" id="historyCard" hidden>
    <h2>🏆 Anciens gagnants</h2>
    <ul id="history"></ul>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
